[pytest]
; asyncio_mode = auto lets plain `async def test_...():` functions run
; directly under pytest (via pytest-asyncio) without needing an explicit
; @pytest.mark.asyncio on every one. Several files (test_jira.py,
; test_jira_adapter.py, test_token_refresh.py) define async test functions
; this way — previously unrunnable under pytest at all ("async def functions
; are not natively supported").
asyncio_mode = auto
