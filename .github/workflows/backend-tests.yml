name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clutsch
          POSTGRES_PASSWORD: clutsch_test
          POSTGRES_DB: clutsch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Ephemeral CI-only database — destroyed with the runner, never
      # reused, so a fixed password here is not a real secret.
      DATABASE_URL: postgresql+asyncpg://clutsch:clutsch_test@localhost:5432/clutsch_test
      # See db_engine.py: pytest/TestClient doesn't guarantee one persistent
      # event loop across calls, which pooled asyncpg connections can't
      # survive. NullPool avoids the "attached to a different loop" errors
      # this caused.
      SQLALCHEMY_NULL_POOL: "true"
      # These specific values are load-bearing, not arbitrary: every test
      # file hardcodes login as admin123/password/sarah123 (via
      # os.environ.setdefault, which only applies if unset — so CI's real
      # value always wins and must match, or every login in the suite 401s).
      ADMIN_PASSWORD: admin123
      JOHN_PASSWORD: password
      SARAH_PASSWORD: sarah123
      ALLOWED_ORIGINS: http://localhost:5173
      ENFORCE_HTTPS: "false"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate CI-only secrets
        # JWT_SECRET_KEY and ENCRYPTION_KEY must exist for the app to start
        # (see main.py's validate_secrets()), and ENCRYPTION_KEY specifically
        # must be a real Fernet key or security.py raises at import time —
        # generated fresh per run rather than hardcoded, same as the .env.example
        # instructions tell a human developer to do locally.
        run: |
          echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Create database schema
        # Uses db_engine.init_db() (Base.metadata.create_all) rather than
        # `alembic upgrade head` — appropriate for this throwaway CI database;
        # a real deployment should run the Alembic migration instead.
        run: python -c "import asyncio; from db_engine import init_db; asyncio.run(init_db())"

      - name: Run test suite
        # Excludes files that are live-server smoke-test scripts (they use
        # `requests` against a running http://localhost instance rather than
        # FastAPI's in-process TestClient) — those need a different kind of
        # CI job (start the server, then hit it) and are not run here.
        #
        # --continue-on-collection-errors: some test files still import names
        # (archived_items, connected_integrations, etc.) removed by the
        # database migration and fail to even load. By default pytest aborts
        # the entire run on any collection error; this flag lets the rest of
        # the suite run anyway so this workflow shows real pass/fail signal
        # for everything else instead of reporting nothing at all.
        run: >-
          pytest -v
          --continue-on-collection-errors
          --ignore=test_api.py
          --ignore=test_auth.py
          --ignore=test_health.py
          --ignore=test_privacy.py
          --ignore=test_rate_limit.py
          --ignore=test_sync_settings.py
