name: Frontend Tests

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # continue-on-error: this surfaced 121 pre-existing lint errors
        # across the whole frontend on first run — real, but far larger
        # than this CI setup's scope (mostly unused imports, but a
        # meaningful minority are genuine React issues: components created
        # during render, setState called synchronously in effects,
        # variables accessed before declaration). Non-blocking for now so
        # CI can actually gate real breakage (build/tests) rather than
        # being permanently red; tracked as separate follow-up work, not
        # silently ignored — see the run's annotations for the full list.
        run: npm run lint
        continue-on-error: true

      - name: Run test suite
        run: npm run test

      - name: Build
        # Catches compile-time errors (bad imports, JSX syntax issues, etc.)
        # that lint/vitest alone wouldn't necessarily surface.
        run: npm run build
